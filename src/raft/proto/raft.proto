syntax = "proto3";

package raftpb;

message RaftRequest {
  bytes data = 1;
  // How many nodes this request has already been forwarded through.
  //
  // Carried in the gRPC envelope rather than the postcard body so a node
  // running an older version, which ignores unknown proto fields, can still
  // decode the request. An absent field decodes as 0.
  uint32 hops = 2;
}

message RaftReply {
  bytes data = 1;
  bytes error = 2;
}

message VoteRequest {
  bytes value = 1;
}

message VoteReply {
  bytes value = 1;
}

message AppendRequest {
  bytes value = 1;
}

message AppendReply {
  bytes value = 1;
}

message SnapshotRequest {
  bytes value = 1;
}

message SnapshotReply {
  bytes value = 1;
}

service RaftService {
  // Forward a request to another node.
  rpc Forward(RaftRequest) returns (RaftReply);

  // Raft Internal
  rpc Append(AppendRequest) returns (AppendReply) {}

  rpc Vote(VoteRequest) returns (VoteReply) {}

  rpc Snapshot(SnapshotRequest) returns (SnapshotReply) {}
}
